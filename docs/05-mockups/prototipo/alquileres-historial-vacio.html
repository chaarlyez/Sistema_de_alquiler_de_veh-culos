<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de alquileres (vacío) — VeloRent</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<!--
  Back-office · Estado especial: el cliente existe pero no tiene alquileres.
  Ejemplo: Diego Ramírez, dado de baja. Su historial se consulta igual (RF41): estar inactivo
  no lo oculta de esta búsqueda.
-->
<div class="app">
  <header class="encabezado">VeloRent · Back-office</header>

  <nav class="menu">
    <a href="vehiculos-listado.html">Vehículos</a>
    <a href="clientes-listado.html">Clientes</a>
    <a href="reservas-listado.html">Reservas</a>
    <a href="alquileres-listado.html" class="activo">Alquileres</a>
  </nav>

  <main class="contenido">
    <div class="titulo-pantalla">
      <h1>Historial de alquileres</h1>
      <a href="alquileres-listado.html" class="boton secundario">Volver a alquileres</a>
    </div>

    <form class="filtros" data-validar action="alquileres-historial.html" method="get" novalidate>
      <div class="campo">
        <label for="documento">Documento del cliente <span class="obligatorio">*</span></label>
        <input id="documento" inputmode="numeric" required data-numerico value="27777888">
      </div>
      <button type="submit" class="boton secundario">Buscar</button>
    </form>

    <section class="tarjeta">
      <h2>Diego Ramírez · DNI 27777888 <span class="estado baja">Inactivo</span></h2>
      <p>diego.ramirez@example.com · dado de baja el 01/02/2026</p>
    </section>

    <div class="aviso">Diego Ramírez no tiene alquileres registrados.</div>
  </main>
</div>
<script src="validacion.js"></script>
</body>
</html>
