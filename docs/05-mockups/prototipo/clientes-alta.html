<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo cliente · VeloRent</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="app">
  <header class="encabezado">VeloRent · Back-office</header>

  <nav class="menu">
    <a href="vehiculos-listado.html">Vehículos</a>
    <a href="clientes-listado.html" class="activo">Clientes</a>
    <a href="reservas-listado.html">Reservas</a>
    <a href="alquileres-listado.html">Alquileres</a>
  </nav>

  <main class="contenido">

    <section class="tarjeta">
      <h2>Nuevo cliente</h2>
      <form data-validar action="clientes-listado.html" method="get" novalidate>
        <div class="campo">
          <label for="nombre">Nombre <span class="obligatorio">*</span></label>
          <input id="nombre" required placeholder="Lucía">
        </div>
        <div class="campo">
          <label for="apellido">Apellido <span class="obligatorio">*</span></label>
          <input id="apellido" required placeholder="Fernández">
        </div>
        <div class="campo">
          <label for="documento">Documento <span class="obligatorio">*</span></label>
          <input id="documento" inputmode="numeric" required data-numerico placeholder="30111222">
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="lucia.fernandez@example.com">
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="tel" placeholder="1155550101">
        </div>
        <div class="botones">
          <button type="submit" class="boton">Guardar</button>
          <a href="clientes-listado.html" class="boton secundario">Cancelar</a>
        </div>
      </form>
    </section>

    <p><a href="clientes-alta-error.html">Ver variantes de error (documento duplicado)</a></p>

  </main>
</div>
<script src="validacion.js"></script>
</body>
</html>
