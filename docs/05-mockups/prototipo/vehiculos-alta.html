<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo vehículo · VeloRent</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="app">
  <header class="encabezado">VeloRent · Back-office</header>

  <nav class="menu">
    <a href="vehiculos-listado.html" class="activo">Vehículos</a>
    <a href="clientes-listado.html">Clientes</a>
    <a href="reservas-listado.html">Reservas</a>
    <a href="alquileres-listado.html">Alquileres</a>
  </nav>

  <main class="contenido">

    <section class="tarjeta">
      <h2>Nuevo vehículo</h2>
      <form data-validar action="vehiculos-listado.html" method="get" novalidate>
        <div class="campo">
          <label for="patente">Patente <span class="obligatorio">*</span></label>
          <input id="patente" required placeholder="AB123CD">
        </div>
        <div class="campo">
          <label for="marca">Marca <span class="obligatorio">*</span></label>
          <input id="marca" required placeholder="Fiat">
        </div>
        <div class="campo">
          <label for="modelo">Modelo <span class="obligatorio">*</span></label>
          <input id="modelo" required placeholder="Cronos">
        </div>
        <div class="campo">
          <label for="anio">Año</label>
          <input id="anio" inputmode="numeric" placeholder="2023">
        </div>
        <div class="campo">
          <label for="tipo">Tipo</label>
          <input id="tipo" placeholder="Económico">
        </div>
        <div class="campo">
          <label for="precio">Precio por día <span class="obligatorio">*</span></label>
          <input id="precio" inputmode="numeric" required placeholder="80000">
        </div>
        <div class="botones">
          <button type="submit" class="boton">Guardar</button>
          <a href="vehiculos-listado.html" class="boton secundario">Cancelar</a>
        </div>
      </form>
    </section>

    <p><a href="vehiculos-alta-error.html">Ver variantes de error (patente duplicada)</a></p>

  </main>
</div>
<script src="validacion.js"></script>
</body>
</html>
